title: Klartext KI
description: >-
  Ein deutschsprachiges Lernprojekt für Menschen, die KI bereits ausprobiert haben –
  aber enttäuscht waren. Konkrete Erklärungen, warum KI oft nicht funktioniert
  und wie man besser damit arbeitet.
baseurl: /Klartext-KI
url: "https://motorradhexe.github.io"

remote_theme: just-the-docs/just-the-docs
color_scheme: light

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - Gemfile
  - Gemfile.lock
  - CLAUDE.md
  - README.md
  - vendor/

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

search_enabled: true

# Seitenstruktur
nav_sort: order
