<script>
  (function () {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');

    function applyScheme(dark) {
      var link = document.querySelector('link[href*="just-the-docs"]');
      if (!link) return;
      var base = link.href.replace(/just-the-docs(-\w+)?\.css(\?.*)?$/, '');
      link.href = base + (dark ? 'just-the-docs-dark.css' : 'just-the-docs.css');
    }

    applyScheme(mq.matches);

    mq.addEventListener('change', function (e) {
      applyScheme(e.matches);
    });
  })();
</script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('pre > code').forEach(function (codeEl) {
      var pre = codeEl.parentElement;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'Kopieren';
      btn.addEventListener('click', function () {
        navigator.clipboard.writeText(codeEl.textContent).then(function () {
          btn.textContent = 'Kopiert ✓';
          setTimeout(function () { btn.textContent = 'Kopieren'; }, 2000);
        });
      });
      pre.appendChild(btn);
    });
  });
</script>
