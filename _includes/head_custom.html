<script>
  (function () {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');

    function applyScheme(dark) {
      var link = document.querySelector('link[href*="just-the-docs"]');
      if (!link) return;
      var base = link.href.replace(/just-the-docs(-\w+)?\.css(\?.*)?$/, '');
      link.href = base + (dark ? 'just-the-docs-dark.css' : 'just-the-docs.css');
    }

    applyScheme(mq.matches);

    mq.addEventListener('change', function (e) {
      applyScheme(e.matches);
    });
  })();
</script>

      'prompt':         'Die Eingabe an ein KI-Modell – Frage, Auftrag oder Anweisung',

      'sprachmodell':   'KI-System, das Text verarbeitet und erzeugt',
      'training':       'Prozess, durch den das Modell aus Texten gelernt hat – einmalig, nicht veränderlich',
      'kontextfenster': 'Obergrenze, wie viel Text das Modell auf einmal verarbeiten kann',
      'modell':         'Der trainierte KI-Kern, der Anfragen berechnet und beantwortet',
      'halluzination':  'KI erfindet plausibel klingende, aber faktisch falsche Aussagen',
      'iteration':      'Ergebnis als Ausgangspunkt nehmen und durch Folgeprompts verbessern',
